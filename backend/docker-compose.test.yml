version: '3.9'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: cohold-postgres-test
    environment:
      POSTGRES_DB: cohold_test
      POSTGRES_USER: cohold_test
      POSTGRES_PASSWORD: cohold_test_password
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cohold_test -d cohold_test']
      interval: 3s
      timeout: 3s
      retries: 20
